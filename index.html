<meta name="apple-mobile-web-app-title" content="Glysa">
<title>Glysa</title>
<style>
/* VOICE: rustig, eerlijk en onderzoekerig; geen alarmtaal, geen risicokleuren
   IDEA: een laboratoriumprotocol op de telefoon: stap voor stap, met versienummer en sessiecode
   PICTURE: een oog met de vaste sprongbaan van het punt; tijdens de test alleen het punt
   COLOUR and TYPE: wit/antraciet met het blauw uit het Glysa-logo (#1f4fbf), violet voor het woordmerk; statussen neutraal; systeemfont
   LAYOUT: één kolom, telefoon eerst; test schermvullend */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111417);--ink:light-dark(#1a1d21,#eef1f3);--mut:light-dark(#5b626b,#a2a9b2);--line:light-dark(#e3e6e9,#2a2f35);--card:light-dark(#f5f7f8,#1a1e22);--br:light-dark(#1f4fbf,#7ab0ff);--brInk:light-dark(#ffffff,#0a1530);--word:light-dark(#2a1f6b,#cfc9ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.scr{display:none;min-height:100%;padding:max(20px,env(safe-area-inset-top)) max(5vw,18px) max(28px,env(safe-area-inset-bottom))}
.scr.on{display:block}
.wrap{max-width:560px;margin:0 auto}
.step{font-size:13px;color:var(--mut);margin:0 0 4px}
h1{font-size:clamp(40px,11vw,52px);line-height:1.05;margin:6px 0 4px;letter-spacing:-.03em;color:var(--br)}
.brand{display:flex;flex-direction:column;align-items:center;margin:6px 0 10px}
.brand img{width:clamp(120px,36vw,160px);height:auto;filter:drop-shadow(0 10px 18px rgba(31,79,191,.28))}
.brand .word{font-size:clamp(30px,9vw,40px);font-weight:300;letter-spacing:.32em;margin:14px 0 0 .32em;color:var(--word);line-height:1}
#s1 .sub{text-align:center}
h2{font-size:24px;line-height:1.2;margin:2px 0 12px}
.sub{color:var(--mut);margin:0 0 14px}
.hero{width:100%;height:auto;display:block;margin:4px 0 12px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.meta dt{color:var(--mut)}.meta dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.box.safe{border-left:4px solid var(--br)}
ul.list{padding:0;margin:0 0 14px;list-style:none}
ul.list li{padding:10px 0 10px 28px;border-top:1px solid var(--line);position:relative}
ul.list li::before{content:"";position:absolute;left:4px;top:18px;width:10px;height:10px;border-radius:50%;border:2px solid var(--br)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:12px 0;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--br)}
.small{font-size:13px;color:var(--mut);line-height:1.45}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--br);color:var(--brInk);font-family:inherit;font-size:17px;font-weight:600;line-height:1.2;margin:10px 0;cursor:pointer;text-align:center;padding:15px 16px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--mut);font-weight:500;min-height:44px;padding:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.check:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2 .btn{margin:6px 0}
.cam{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:16px;overflow:hidden;margin:4px 0 10px;display:grid;place-items:center;color:#9aa3ad;font-size:14px}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.ind{display:grid;gap:6px;margin:0 0 10px}
.ind div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--card);font-size:15px}
.ind b{font-weight:600}.ind span{color:var(--mut)}.ind .y span{color:var(--br);font-weight:600}
.err{color:#b3261e;font-weight:600;margin:8px 0}
#run{position:fixed;inset:0;padding:0;background:#0d1012;color:#fff;overflow:hidden}
#runHead{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 14px 0;font-size:14px;color:#b9c1c9;z-index:2}
#runStop{background:transparent;border:1px solid #4a525b;color:#d6dbe0;border-radius:99px;padding:8px 14px;font:inherit;min-height:40px;cursor:pointer}
#dot{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #2aa8e6,0 0 0 11px rgba(42,168,230,.28);left:50%;top:50%;visibility:hidden}
#cd{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:700;pointer-events:none}
#lostTag{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:14px;background:#3a4047;padding:5px 12px;border-radius:99px;display:none}
#panel{position:absolute;inset:0;display:none;place-items:center;padding:20px;background:rgba(13,16,18,.92);z-index:3}
#panel .card{background:var(--bg);color:var(--ink);border-radius:18px;padding:18px;max-width:440px;width:100%}
#panel h3{margin:0 0 6px;font-size:21px;line-height:1.2}
#panel p{margin:0 0 8px}
.stat{border:1px solid var(--line);border-radius:16px;padding:16px;margin:4px 0 12px;background:var(--card)}
.stat h3{margin:0 0 6px;font-size:22px;line-height:1.2}
.blocks{display:flex;gap:6px;margin:8px 0 2px}.blocks i{width:28px;height:10px;border-radius:3px;border:2px solid var(--ink)}.blocks i.f{background:var(--ink)}
table.parts{width:100%;border-collapse:collapse;font-size:15px;margin:0 0 12px}
table.parts td{padding:10px 4px;border-top:1px solid var(--line)}table.parts td+td{text-align:right;color:var(--mut)}
.code{font-size:30px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;background:var(--card);border:1px dashed var(--mut);border-radius:12px;padding:12px;text-align:center;margin:6px 0 14px;white-space:nowrap}
input.pin{width:100%;font-size:20px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.3em;text-align:center}
details.ses{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card)}
details.ses summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}
details.ses summary small{display:block;font-weight:400;color:var(--mut);font-size:13px}
details.ses .in{padding:0 14px 14px}
.scroll{overflow-x:auto}
table.m{border-collapse:collapse;font-size:13px;width:100%;min-width:420px}
table.m th,table.m td{padding:6px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.m th:first-child,table.m td:first-child{text-align:left}
table.m thead th{color:var(--mut);font-weight:600;border-top:0}
.fig{position:relative;height:110px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--bg)}
.fig canvas{position:absolute;inset:0;width:100%;height:100%}
.log{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums;margin:0;padding-left:18px}
.tag{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--mut);border-radius:6px;padding:0 6px;margin-left:6px;color:var(--mut)}
.foot{text-align:center;margin-top:12px}
.foot a{color:var(--mut);font-size:14px}
</style>
</head>
<body>

<script>
// ---- Glysa meetkern (AOKC-1) — gedeeld door beide taalversies ----
// Sample: {t (ms), g (blikratio of null), lum (helderheid 0-255 of undefined)}
// Sprong:  {t (ms), x (doelpositie -1..1)}
function median(a){ if(!a.length) return NaN; const b=[...a].sort((p,q)=>p-q), m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; }
function fitLine(xs, ys){
  const n = xs.length; if (n < 3) return { a:NaN, k:NaN, r:0 };
  const mx = xs.reduce((p,q)=>p+q,0)/n, my = ys.reduce((p,q)=>p+q,0)/n;
  let sxy=0, sxx=0, syy=0;
  for (let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
  const k = sxx ? sxy/sxx : NaN;
  return { a: my - k*mx, k, r: (sxx && syy) ? sxy/Math.sqrt(sxx*syy) : 0 };
}
function targetAt(J, t){ let k=-1; for (let i=0;i<J.length;i++) if (J[i].t <= t) k=i; return k; }
function smooth(valid){
  return valid.map((s,i,a) => (i===0 || i===a.length-1) ? { t:s.t, g:s.g } : { t:s.t, g:median([a[i-1].g, s.g, a[i+1].g]) });
}
function lightIssue(S){

// Stap 3-4 van AOKC: één testdeel meten en de kwaliteit controleren.
function measurePart(S, J, cal){

  const lost = S.length ? 1 - valid.length/S.length : 1;

    const tj = J[i].t, dxT = J[i].x - J[i-1].x;

    const d = Math.sign(dxT), end = (i+1 < J.length ? J[i+1].t : tj + 900);
    const before = z.filter(p => p.t >= tj-200 && p.t <= tj); if (!before.length) continue;
    const base = median(before.map(p => p.z));
    const win = z.filter(p => p.t > tj-40 && p.t <= Math.min(end, tj+900));
    const half = 0.5*Math.abs(dxT); let tc = null, vmax = 0;
    for (let m=1;m<win.length;m++){
      const p0=(win[m-1].z-base)*d, p1=(win[m].z-base)*d;
      if (tc == null && p0 < half && p1 >= half) tc = win[m-1].t + (half-p0)/(p1-p0)*(win[m].t-win[m-1].t);
      const dt = (win[m].t-win[m-1].t)/1000; if (dt > 0){ const v=(win[m].z-win[m-1].z)*d/dt; if (v > vmax) vmax = v; }
    }

    ok: issues.length === 0, issues,
    metrics: {
      latency_ms: lats.length ? Math.round(median(lats)) : null,               // tijd tot halverwege de sprong
      peak_velocity_pct_s: vels.length ? Math.round(median(vels)) : null,       // % schermbreedte per seconde

      accuracy_r: +Math.abs(f.r).toFixed(2),                                    // correlatie blik-doel (0-1)

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:60} }, audio:false });
    vid.srcObject = stream; await vid.play(); $('camMsg').textContent = '';
  } catch(e){ $('camMsg').textContent = ''; $('err').textContent = TXT.errCam; $('err').hidden = false; $('b4demo').hidden = false; return; }
  if (!landmarker){
    $('camMsg').textContent = TXT.loading;
    try {
      const to = setTimeout(() => { if (!landmarker){ $('err').textContent = TXT.errModel; $('err').hidden = false; $('b4demo').hidden = false; } }, 25000);
      const { FaceLandmarker, FilesetResolver } = await import(MP + '/vision_bundle.mjs');
      const files = await FilesetResolver.forVisionTasks(MP + '/wasm');
      const opts = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:d }, runningMode:'VIDEO', numFaces:1 });
      try { landmarker = await FaceLandmarker.createFromOptions(files, opts('GPU')); } catch(e){ landmarker = await FaceLandmarker.createFromOptions(files, opts('CPU')); }
      clearTimeout(to); $('err').hidden = true; $('b4demo').hidden = true;
    } catch(e){ $('err').textContent = TXT.errModel; $('err').hidden = false; $('b4demo').hidden = false; return; }
    $('camMsg').textContent = '';
  }
  running = true; loop();
}
function stopCamera(){ running = false; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; stopSim(); }
function loop(){
  if (!running) return;
  if (vid.currentTime !== lastVT && vid.readyState >= 2 && landmarker){
    lastVT = vid.currentTime; frameN++;
    const now = performance.now();
    let res = null; try { res = landmarker.detectForVideo(vid, now); } catch(e){}
    const L = res && res.faceLandmarks && res.faceLandmarks[0];
    const g = (L && L.length > 473) ? gazeFrom(L, vid.videoWidth, vid.videoHeight) : null;
    if (frameN % 6 === 1) lumNow = lumOfFrame();
    if (recorder) recorder(now, g, lumNow);
    if ($('s4').classList.contains('on')){ drawOverlay(L); renderInd(checkFace(L, lumNow)); }
  }
  if (vid.requestVideoFrameCallback) vid.requestVideoFrameCallback(loop); else requestAnimationFrame(loop);
}
// Demomodus: gesimuleerd oog dat het punt volgt met ~220 ms vertraging
function startSim(){
  stopSim();
  simTimer = setInterval(() => {
    const now = performance.now(), tt = now - 220;
    let k = -1; for (let i=0;i<targetLog.length;i++) if (targetLog[i].t <= tt) k = i;
    let e = 0;
    if (k >= 0){ const p = Math.min(1, (tt - targetLog[k].t)/55), prev = k ? targetLog[k-1].x : 0; e = prev + (targetLog[k].x - prev)*p; }
    const g = Math.random() < .02 ? null : 0.5 - 0.08*e + (Math.random()-.5)*0.006;
    if (recorder) recorder(now, g, 130);
  }, 1000/30);
}
function stopSim(){ if (simTimer) clearInterval(simTimer); simTimer = null; }

// ---------------- Visuele opdracht ----------------
const dot = $('dot'), cd = $('cd'), lostTag = $('lostTag');
let aborted = false, wake = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function place(x){ const m = Math.min(60, innerWidth*.08); dot.style.left = (m + (x+1)/2*(innerWidth-2*m)) + 'px'; dot.style.top = '50%'; targetLog.push({ t:performance.now(), x }); if (targetLog.length > 400) targetLog.splice(0, 200); }
async function enterRun(label){
  $('runLbl').textContent = label; $('panel').style.display = 'none'; show('run');
  try { await document.documentElement.requestFullscreen?.(); } catch(e){}
  try { wake = wake || await navigator.wakeLock?.request('screen'); } catch(e){}
}
async function exitRun(){ try { if (document.fullscreenElement) await document.exitFullscreen(); } catch(e){} try { wake && wake.release(); } catch(e){} wake = null; }
async function countdown(){ dot.style.visibility = 'hidden'; for (const n of [3,2,1]){ if (aborted) return; cd.textContent = n; await sleep(650); } cd.textContent = ''; }
function runSeq(seq){
  return new Promise(done => {
    const S = [], J = []; const t0 = performance.now();
    const cum = []; seq.iv.reduce((a,v,i) => (cum[i] = a + v, a + v), 0);
    let idx = 0; place(seq.x[0]); J.push({ t:0, x:seq.x[0] }); dot.style.visibility = 'visible';
    recorder = (now, g, lum) => { S.push({ t:now - t0, g, lum }); lostTag.style.display = g == null ? 'block' : 'none'; };
    const tick = () => {
      const el = performance.now() - t0;
      if (aborted || el >= cum[cum.length-1]){ recorder = null; dot.style.visibility = 'hidden'; lostTag.style.display = 'none'; done({ S, J }); return; }
      while (idx < cum.length-1 && el >= cum[idx]){ idx++; place(seq.x[idx]); J.push({ t:performance.now() - t0, x:seq.x[idx] }); }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
function panel(title, text, small, buttons){
  return new Promise(res => {
    $('pH').textContent = title; $('pP').textContent = text; $('pS').textContent = small || '';
    $('pB').innerHTML = buttons.map((b,i) => `<button class="btn ${b.sec?'sec':''}" data-i="${i}">${b.label}</button>`).join('');
    $('panel').style.display = 'grid';
    $('pB').querySelectorAll('button').forEach(el => el.onclick = () => { $('panel').style.display = 'none'; res(buttons[+el.dataset.i].id); });
  });
}
const issueText = iss => iss.map(i => TXT.tips[i]).join(' ');

// ---------------- Sessie (AOKC) ----------------
let ses = null;
function newCode(){ const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', r = n => Array.from({length:n}, () => A[Math.floor(Math.random()*A.length)]).join(''); return `GLY-${r(4)}-${r(2)}`; }
function newSession(){
  ses = { code:newCode(), date:new Date().toISOString(), app_version:APP_VERSION, method:METHOD, protocol:PROTOCOL_ID, lang:LANG, mode:SIM?'demo':'camera',
          device:navigator.userAgent.slice(0,160), screen:`${screen.width}x${screen.height}`, cal_attempts:0, cal:null, parts:[], corrections:[], status:null, stopped:false };
}
function saveSession(){
  const all = DB.get('glysa_sessions', []); all.push(ses); DB.set('glysa_sessions', all.slice(-100)); logAct('session');
}
function compact(S){ return S.map(s => [Math.round(s.t), s.g == null ? null : +s.g.toFixed(4)]); }

function calScreen(state){
  const m = PROTOCOL.maxCalAttempts;
  $('calAtt').textContent = ses.cal_attempts ? f(TXT.attempt, { n:ses.cal_attempts, m }) : '';
  if (state === 'intro'){ $('calH').textContent = TXT.calTitle; $('calP').textContent = TXT.calTxt; $('b5').textContent = TXT.calBtn; $('b5').onclick = runCal; }
  if (state === 'ok'){ $('calH').textContent = TXT.calOk; $('calP').textContent = TXT.calOkTxt; $('b5').textContent = TXT.testBtn; $('b5').onclick = runParts; }
  if (state === 'fail'){ $('calH').textContent = TXT.calFail; $('calP').textContent = issueText(ses._lastIssues); $('b5').textContent = TXT.calRetry; $('b5').onclick = runCal; }
  if (state === 'giveup'){ $('calH').textContent = TXT.calFail; $('calP').textContent = f(TXT.calGiveUp, { m }); $('b5').textContent = TXT.toCheck; $('b5').onclick = () => finishSession(); }
  show('s5');
}
async function runCal(){
  aborted = false;
  await enterRun(TXT.calibrating); await countdown(); if (aborted) return;
  const { S, J } = await runSeq(PROTOCOL.cal); if (aborted) return;
  await exitRun();
  const c = calibrate(S, J); ses.cal_attempts++;
  if (c.ok){ ses.cal = { a:c.a, k:c.k, r:+c.r.toFixed(3), lost_pct:Math.round(c.lost*100), attempt:ses.cal_attempts }; calScreen('ok'); }
  else { ses._lastIssues = c.issues; ses.corrections.push({ step:'cal', attempt:ses.cal_attempts, issues:c.issues });
         calScreen(ses.cal_attempts >= PROTOCOL.maxCalAttempts ? 'giveup' : 'fail'); }
}
async function runParts(){
  aborted = false;
  for (let p = 0; p < PROTOCOL.parts.length; p++){
    const part = { part:p+1, status:null, attempts:[] };
    ses.parts.push(part);
    let attempt = 0;
    while (true){
      attempt++;
      await enterRun(f(TXT.partLbl, { n:p+1 }) + ' · ' + TXT.follow); await countdown(); if (aborted) return;
      const { S, J } = await runSeq(PROTOCOL.parts[p]); if (aborted) return;
      const m = measurePart(S, J, ses.cal);
      part.attempts.push({ issues:m.issues, metrics:m.metrics, samples:compact(S), jumps:J.map(j => [Math.round(j.t), j.x]) });
      const last = p === PROTOCOL.parts.length-1;
      if (attempt > 1){ const c = ses.corrections[ses.corrections.length-1]; if (c && c.part === p+1) c.helped = m.ok; }
      if (m.ok){
        part.status = attempt === 1 ? 'ok' : 'ok-repeat';
        await panel(f(TXT.partOk, { n:p+1 }), TXT.partOkTxt, '', [{ id:'n', label: last ? TXT.finishRun : TXT.nextBtn }]);
        break;
      }
      if (attempt <= PROTOCOL.maxRepeatsPerPart){
        const ch = await panel(f(TXT.partBad, { n:p+1 }), issueText(m.issues), '', [{ id:'r', label:TXT.repeatBtn }, { id:'s', label:TXT.skipBtn, sec:true }]);
        if (ch === 'r'){ ses.corrections.push({ step:'part', part:p+1, issues:m.issues, action:'repeat' }); continue; }
        part.status = 'invalid';
        await panel(f(TXT.partBad, { n:p+1 }), TXT.markedInvalid, '', [{ id:'n', label: last ? TXT.finishRun : TXT.nextBtn }]);
        break;
      }
      part.status = 'invalid';
      await panel(f(TXT.partBad, { n:p+1 }), issueText(m.issues), TXT.markedInvalid, [{ id:'n', label: last ? TXT.finishRun : TXT.nextBtn }]);
      break;
    }
  }
  await exitRun();
  finishSession();
}
function finishSession(){
  stopCamera();
  delete ses._lastIssues;
  ses.status = ses.cal ? sessionStatus(ses.parts) : 'unusable';
  saveSession();
  const usable = ses.parts.filter(p => p.status !== 'invalid').length;
  $('stH').textContent = TXT.st[ses.status];
  $('stBlocks').innerHTML = [0,1,2].map(i => `<i class="${ses.parts[i] && ses.parts[i].status !== 'invalid' ? 'f' : ''}"></i>`).join('');
  $('stCount').textContent = f(TXT.usableCount, { u:usable });
  const rows = [`<tr><td>${TXT.calRow}</td><td>${ses.cal ? f(TXT.calRowOk, { n:ses.cal.attempt }) : TXT.calRowFail}</td></tr>`];
  for (let i=0;i<3;i++){ const p = ses.parts[i]; rows.push(`<tr><td>${f(TXT.partRow, { n:i+1 })}</td><td>${TXT.ps[p ? p.status : 'none']}</td></tr>`); }
  $('partsTbl').innerHTML = rows.join('');
  show('s7');
}
function stopSession(){
  if (ses && !ses.status){
    aborted = true; recorder = null; ses.stopped = true; ses.status = 'unusable';
    if (ses.parts.length && !ses.parts[ses.parts.length-1].status) ses.parts[ses.parts.length-1].status = 'invalid';
    delete ses._lastIssues; saveSession(); exitRun(); stopCamera();
    $('doneH').textContent = TXT.stoppedTitle; $('doneP').textContent = TXT.stoppedTxt; $('code').textContent = ses.code; show('s8');
  } else { stopCamera(); show('s1'); }
}

// ---------------- Onderzoekersgedeelte ----------------
function fmtDate(iso){ try { return new Date(iso).toLocaleString(TXT.locale, { dateStyle:'short', timeStyle:'short' }); } catch(e){ return iso; } }
function renderResearch(){
  const all = DB.get('glysa_sessions', []).slice().reverse();
  const v = x => x == null ? '–' : x;
  $('sesList').innerHTML = all.length ? all.map((s, si) => {
    const rows = s.parts.map(p => { const a = p.attempts[p.attempts.length-1], m = a ? a.metrics : {}; return `<tr><td>${p.part}</td><td>${TXT.ps[p.status] || '–'}</td><td>${v(m.latency_ms)}</td><td>${v(m.peak_velocity_pct_s)}</td><td>${v(m.gain)}</td><td>${v(m.accuracy_r)}</td><td>${v(m.stability_pct)}</td><td>${v(m.lost_pct)}</td><td>${v(m.fps)}</td></tr>`; }).join('');
    const corr = s.corrections.length ? s.corrections.map(c => c.step === 'cal' ? `${TXT.calRow} #${c.attempt}: ${c.issues.join(', ')}` : f(TXT.corrTxt, { p:c.part, i:c.issues.join(', '), h: c.helped ? TXT.helped : TXT.notHelped })).join('; ') : TXT.corrNone;
    return `<details class="ses"><summary>${s.code}${s.mode==='demo'?`<span class="tag">demo</span>`:''}${s.stopped?`<span class="tag">${TXT.stoppedTag}</span>`:''}<small>${fmtDate(s.date)} · ${TXT.st[s.status] || '–'}</small></summary><div class="in">
      <p class="small">${TXT.versionLbl}: ${s.app_version} · ${TXT.methodLbl}: ${s.method} · ${TXT.protocolLbl}: ${s.protocol} · ${TXT.calRow}: ${s.cal ? 'r ' + s.cal.r + ', ' + f(TXT.attempt, { n:s.cal.attempt, m:PROTOCOL.maxCalAttempts }) : TXT.calRowFail}</p>
      ${rows ? `<div class="scroll"><table class="m"><thead><tr>${TXT.mh.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>` : ''}
      ${s.cal && s.parts.length ? `<div class="fig"><canvas data-si="${si}"></canvas></div><p class="small">${TXT.chartCap}</p>` : ''}
      <p class="small">${TXT.corrLbl}: ${corr}</p>
      <p class="small">${TXT.device}: ${s.device} (${s.screen})</p></div></details>`;
  }).join('') : `<p class="small">${TXT.noSessions}</p>`;
  $('sesList').querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { const c = d.querySelector('canvas'); if (d.open && c) drawSes(c, all[+c.dataset.si]); }));
  const L = DB.get('glysa_log', []).slice(-10).reverse();
  $('logList').innerHTML = L.map(e => `<li>${fmtDate(new Date(e.t).toISOString())} — ${TXT.logActs[e.a] || e.a}</li>`).join('');
}
function drawSes(c, s){
  const dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight; c.width = W*dpr; c.height = H*dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const n = s.parts.length, pw = (W - 10*(n+1))/n, col = '#2a6fe0';
  s.parts.forEach((p, i) => {
    const a = p.attempts[p.attempts.length-1]; if (!a) return;
    const T = a.jumps.length ? Math.max(7100, a.samples.length ? a.samples[a.samples.length-1][0] : 0) : 7100;
    const X = t => 10 + i*(pw+10) + t/T*pw, Y = v => H/2 - Math.max(-1.2, Math.min(1.2, v))*(H/2-10);
    x.strokeStyle = '#8a9199'; x.lineWidth = 1.5; x.beginPath();
    a.jumps.forEach((j, k) => { const te = k+1 < a.jumps.length ? a.jumps[k+1][0] : T; if (!k) x.moveTo(X(j[0]), Y(j[1])); else x.lineTo(X(j[0]), Y(j[1])); x.lineTo(X(te), Y(j[1])); }); x.stroke();
    x.strokeStyle = col; x.lineWidth = 1.5; x.beginPath(); let st = false;
    a.samples.forEach(([t, g]) => { if (g == null){ st = false; return; } const z = (g - s.cal.a)/s.cal.k; if (!st){ x.moveTo(X(t), Y(z)); st = true; } else x.lineTo(X(t), Y(z)); }); x.stroke();
  });
}
function download(name, text, type){
  const b = new Blob([text], { type }), u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function toCsv(all){
  const H = ['session_code','date','mode','app_version','method','protocol','lang','cal_attempts','cal_r','stopped','session_status','part','part_status','attempts','latency_ms','peak_velocity_pct_s','gain','accuracy_r','stability_pct','lost_pct','fps','saccades'];
  const rows = [H.join(',')];
  all.forEach(s => {
    const base = [s.code, s.date, s.mode, s.app_version, s.method, s.protocol, s.lang, s.cal_attempts, s.cal ? s.cal.r : '', s.stopped, s.status];
    if (!s.parts.length) rows.push([...base, '', '', 0, '', '', '', '', '', '', '', ''].join(','));
    s.parts.forEach(p => { const a = p.attempts[p.attempts.length-1], m = a ? a.metrics : {}; const q = x => x == null ? '' : x;
      rows.push([...base, p.part, p.status, p.attempts.length, q(m.latency_ms), q(m.peak_velocity_pct_s), q(m.gain), q(m.accuracy_r), q(m.stability_pct), q(m.lost_pct), q(m.fps), q(m.saccades)].join(',')); });
  });
  return rows.join('\n');
}
const stamp = () => new Date().toISOString().slice(0,10).replace(/-/g,'');

// ---------------- Knoppen ----------------
$('b1').onclick = () => { SIM = false; newSession(); $('consent').checked = false; $('b2').disabled = true; show('s2'); };
$('b1demo').onclick = () => { SIM = true; newSession(); $('consent').checked = false; $('b2').disabled = true; show('s2'); };
$('consent').onchange = e => { $('b2').disabled = !e.target.checked; };
$('b2stop').onclick = () => { ses = null; show('s1'); };
$('b2').onclick = () => show('s3');
$('b3').onclick = () => { show('s4'); startCamera(); };
$('b4demo').onclick = () => { stopCamera(); SIM = true; if (ses) ses.mode = 'demo'; $('b4demo').hidden = true; $('err').hidden = true; startCamera(); };
$('b4').onclick = () => { ses.cal_attempts = 0; calScreen('intro'); };
[$('b3stop'), $('b4stop'), $('b5stop'), $('runStop')].forEach(b => b.onclick = () => (b.id === 'b3stop' ? (ses = null, show('s1')) : stopSession()));
$('b7').onclick = () => { $('doneH').textContent = TXT.doneTitle; $('doneP').textContent = TXT.doneTxt; $('code').textContent = ses.code; show('s8'); };
$('b8').onclick = () => { ses = null; show('s1'); };
$('toRes').onclick = e => { e.preventDefault(); $('pin').value = ''; $('pinErr').hidden = true; $('pinBox').hidden = false; $('resBox').hidden = true; show('sr'); };
$('pinBack').onclick = () => show('s1');
const openRes = () => { if ($('pin').value === '2468'){ logAct('open'); $('pinBox').hidden = true; $('resBox').hidden = false; renderResearch(); } else $('pinErr').hidden = false; };
$('pinBtn').onclick = openRes; $('pin').onkeydown = e => { if (e.key === 'Enter') openRes(); };
$('exCsv').onclick = () => { logAct('export_csv'); download(`glysa-sessions-${stamp()}.csv`, toCsv(DB.get('glysa_sessions', [])), 'text/csv'); renderResearch(); };
$('exJson').onclick = () => { logAct('export_json'); download(`glysa-sessions-${stamp()}.json`, JSON.stringify({ exported:new Date().toISOString(), app_version:APP_VERSION, method:METHOD, protocol:PROTOCOL, sessions:DB.get('glysa_sessions', []) }, null, 1), 'application/json'); renderResearch(); };
let clearArm = false;
$('clearBtn').onclick = () => {
  if (!clearArm){ clearArm = true; $('clearBtn').textContent = TXT.clearConfirm; setTimeout(() => { clearArm = false; $('clearBtn').textContent = TXT.clearBtn; }, 4000); return; }
  DB.set('glysa_sessions', []); logAct('clear'); clearArm = false; $('clearBtn').textContent = TXT.clearBtn; renderResearch();
};
$('resOut').onclick = () => show('s1');
window.__glysa = { show, finishSession, get ses(){ return ses; }, set ses(v){ ses = v; }, renderResearch, openRes };
}
