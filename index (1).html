<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a3fb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GLYSA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>GLYSA</title>
<style>
/* VOICE: medisch, rustig, betrouwbaar; groot en duidelijk voor ouderen; crisismodus maximaal eenvoudig
   IDEA: een medische app met een herkenbaar merk: het blauw-paarse oogicoon van GLYSA
   PICTURE: het logo op een blauw-paarse kleurverloopband; in de crisismodus alleen grote knoppen
   COLOUR and TYPE: wit, blauw #1f4fbf, paars #3b1f9e, cyaan #18a9e6; rood alleen voor de crisisknop; systeemfont, rem-maten voor tekstgrootte
   LAYOUT: één kolom, telefoon eerst, onderbalk met 4 knoppen en CELYN in het midden */
:root{color-scheme:light dark;--bg:light-dark(#f6f7fc,#0e1020);--surf:light-dark(#ffffff,#171a2e);--ink:light-dark(#15172b,#eef0fb);--mut:light-dark(#5b6078,#a8adc8);--line:light-dark(#e1e4f0,#2a2e4a);
 --blue:#1f4fbf;--purple:#3b1f9e;--cyan:#18a9e6;--br:light-dark(#1f4fbf,#8fb2ff);--grad:linear-gradient(135deg,#18a9e6 0%,#1f4fbf 48%,#3b1f9e 100%);--red:#d92745;--word:light-dark(#2a1f6b,#d4ceff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.ic{width:1.4em;height:1.4em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.scr{display:none;min-height:100vh;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.scr.on{display:block}
.wrap{max-width:620px;margin:0 auto;padding:0 max(4.5vw,16px)}
.top{background:var(--grad);color:#fff;padding:max(16px,env(safe-area-inset-top)) 0 22px;border-radius:0 0 26px 26px;margin-bottom:16px}
.top .wrap{display:flex;align-items:center;gap:12px}
.top h1,.top h2{margin:0;font-size:1.5rem;line-height:1.2}
.top p{margin:2px 0 0;opacity:.9;font-size:.95rem}
.top .logo{width:46px;height:46px;border-radius:12px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.iconbtn{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:12px;min-width:44px;min-height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.sp{flex:1}
h2.h{font-size:1.35rem;line-height:1.2;margin:18px 0 10px}
h3{font-size:1.1rem;margin:16px 0 8px;line-height:1.25}
p{margin:0 0 10px}
.mut{color:var(--mut)}.small{font-size:.86rem;color:var(--mut);line-height:1.45}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0}
.note{border-left:4px solid var(--br);background:var(--surf);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.92rem}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border:0;border-radius:16px;background:var(--grad);color:#fff;font-family:inherit;font-size:1.05rem;font-weight:650;line-height:1.2;margin:10px 0;cursor:pointer;text-align:center;text-decoration:none;padding:14px 16px}
.btn.sec{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--mut);font-weight:500;min-height:46px}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.row2 .btn{margin:6px 0}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:.95rem}
input.in,select.in,textarea.in{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);min-height:48px}
textarea.in{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surf);cursor:pointer;font-size:.95rem;min-height:44px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surf);border-radius:18px;padding:16px;margin:10px 0;cursor:pointer;font:inherit;color:inherit}
.opt b{display:block;font-size:1.1rem;margin-bottom:4px}.opt.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,79,191,.18)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1 1 80px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;cursor:pointer;padding:8px}.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.seg.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:118px}
.tile .ib{width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center}
.tile b{font-size:1.02rem;line-height:1.2}.tile span{font-size:.84rem;color:var(--mut);line-height:1.3}
.crisisbtn{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:22px;background:var(--red);color:#fff;padding:20px;cursor:pointer;font:inherit;text-align:left;box-shadow:0 10px 24px rgba(217,39,69,.3);margin:4px 0 6px}
.crisisbtn b{display:block;font-size:1.6rem;letter-spacing:.04em;line-height:1.1}.crisisbtn span{font-size:.95rem;opacity:.95}
.crisisbtn .ic{width:42px;height:42px}
.badge{display:inline-block;font-size:.75rem;font-weight:700;border-radius:99px;padding:2px 9px;background:rgba(31,79,191,.12);color:var(--br);vertical-align:middle}
.badge.w{background:rgba(255,255,255,.22);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf);border-top:1px solid var(--line);display:none;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav.on{display:flex;justify-content:space-around;align-items:flex-end}
.nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;min-height:52px;cursor:pointer;padding:4px}
.nav button.on{color:var(--br);font-weight:700}
.nav .mid{transform:translateY(-14px)}.nav .mid .ic{width:30px;height:30px}
.nav .mid i{width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(31,79,191,.35)}
#splash,#lang{padding:0}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.biglogo{width:min(46vw,190px);height:auto;filter:drop-shadow(0 14px 26px rgba(31,79,191,.3))}
.word{font-size:clamp(2rem,9vw,2.6rem);font-weight:300;letter-spacing:.32em;margin:16px 0 4px .32em;color:var(--word);line-height:1}
#splash .biglogo{animation:pop .9s ease-out both}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){#splash .biglogo{animation:none}}
.langs{display:grid;gap:10px;width:min(100%,380px);margin-top:18px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:var(--grad)}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--line);display:grid;place-items:center;color:var(--mut);overflow:hidden;flex:none}
.prow{display:flex;gap:14px;align-items:center}
.cam{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:18px;overflow:hidden;margin:6px 0 10px;display:grid;place-items:center;color:#9aa3c0;font-size:.9rem}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.ind{display:grid;gap:6px;margin:0 0 10px}
.ind div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surf);border:1px solid var(--line);font-size:.95rem}
.ind span{color:var(--mut)}.ind .y span{color:var(--br);font-weight:700}
.guideline{font-weight:600;color:var(--br);min-height:1.5em}
.err{color:var(--red);font-weight:600;margin:8px 0}
#run{position:fixed;inset:0;padding:0;background:#0b0d1a;color:#fff;z-index:30;overflow:hidden}
#runHead{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 0;font-size:.9rem;color:#c2c8e6;z-index:2}
#runStop{background:transparent;border:1px solid #4a5078;color:#dfe3ff;border-radius:99px;padding:8px 16px;font:inherit;min-height:42px;cursor:pointer}
#dot{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #18a9e6,0 0 0 12px rgba(24,169,230,.3);left:50%;top:50%;visibility:hidden}
#cd{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;font-weight:700;pointer-events:none}
#lostTag{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:.9rem;background:#3b3f63;padding:6px 14px;border-radius:99px;display:none}
.qcard{border-radius:18px;padding:16px;margin:8px 0 12px;color:#fff;background:var(--grad)}.qcard.poor{background:#5b6078}
.qcard h3{margin:0 0 4px;font-size:1.25rem}.qcard p{margin:0}
table.obs{width:100%;border-collapse:collapse;font-size:.95rem}
table.obs td{padding:9px 4px;border-top:1px solid var(--line)}table.obs td+td{text-align:right;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
table.obs small{display:block;font-weight:400;color:var(--mut);font-size:.78rem}
/* crisismodus: hoog contrast */
#crisis{background:#05060d;color:#fff;padding-bottom:30px}
#crisis .ch{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) max(4.5vw,16px) 6px;max-width:620px;margin:0 auto}
#crisis .ch b{font-size:1.5rem;letter-spacing:.06em;color:#ff5c77}
#crisis .cb{border:2px solid #fff;background:transparent;color:#fff;border-radius:14px;min-width:52px;min-height:52px;display:grid;place-items:center;cursor:pointer}
#crisis .big{font-size:1.65rem;font-weight:700;line-height:1.25;margin:10px 0 14px}
#crisis .xl{display:flex;align-items:center;gap:14px;width:100%;min-height:78px;border-radius:20px;border:3px solid #fff;background:#141833;color:#fff;font:inherit;font-size:1.35rem;font-weight:700;padding:14px 18px;margin:12px 0;cursor:pointer;text-decoration:none;text-align:left;line-height:1.2}
#crisis .xl .ic{width:34px;height:34px}
#crisis .xl.red{background:#d92745;border-color:#ff8fa1}
#crisis .xl.yel{background:#ffd23f;color:#111;border-color:#ffd23f}
#crisis .xl.pulse{animation:pl 1s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 0 0 10px rgba(255,92,119,.45)}}
#crisis p,#crisis li{font-size:1.25rem;line-height:1.45}
#crisis .warn{border:3px solid #ffd23f;border-radius:16px;padding:12px 14px;color:#ffe48a;font-weight:600}
#crisis .timer{font-size:clamp(4rem,22vw,7rem);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
#crisis .vstat{min-height:1.6em;color:#9fe3ff;font-weight:600}
#crisis .msgbox{background:#141833;border:2px solid #4a5078;border-radius:14px;padding:12px;font-size:1.1rem;white-space:pre-wrap;word-break:break-word}
.timerbar{display:flex;align-items:center;gap:10px;background:#ffd23f;color:#111;border-radius:14px;padding:12px 14px;margin:6px 0;font-weight:700;cursor:pointer;border:0;width:100%;font:inherit;font-weight:700}
/* noodkaart */
.ecard{border-radius:20px;overflow:hidden;border:2px solid var(--blue);background:#fff;color:#111;margin:10px 0}
.ecard .eh{background:var(--grad);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.ecard .eh img{width:36px;height:36px;border-radius:9px}
.ecard .eb{padding:14px 16px}
.ecard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.ecard dt{color:#5b6078;font-size:.85rem}.ecard dd{margin:0;font-weight:650}
.ecard .instr{margin-top:12px;padding:12px;border-radius:12px;background:#fff1f3;border:2px solid #d92745;font-weight:700;color:#7a0d20}
/* dagboek */
.day{font-weight:700;margin:18px 0 6px;color:var(--mut);font-size:.9rem}
.ent{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0}
.ent .eh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.ent .tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(31,79,191,.12);color:var(--br)}
.ent .tag.x{background:rgba(59,31,158,.14);color:light-dark(#3b1f9e,#c9bcff)}
.ent .g{font-size:1.25rem;font-weight:750}
.del{background:none;border:0;color:var(--mut);font:inherit;font-size:.85rem;cursor:pointer;min-height:36px;padding:4px 8px}
details.box{background:var(--surf);border:1px solid var(--line);border-radius:16px;margin:10px 0}
details.box summary{padding:14px 16px;font-weight:650;cursor:pointer;display:flex;align-items:center;gap:10px}
details.box .in{padding:0 16px 14px}
/* rapport */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}.stat span{font-size:.82rem;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding:6px 0;border-bottom:1px solid var(--line)}
.bars i{flex:1;background:var(--grad);border-radius:4px 4px 0 0;min-height:2px}
.fig{position:relative;height:180px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;margin:6px 0;font-size:.92rem}
.hbar .t{grid-column:1/-1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--grad)}
.scroll{overflow-x:auto}
table.rt{border-collapse:collapse;width:100%;min-width:480px;font-size:.85rem}
table.rt th,table.rt td{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.rt th{color:var(--mut);border-top:0}
.prhead{display:none}
/* celyn */
.chero{background:var(--grad);color:#fff;border-radius:22px;padding:22px 18px;margin:12px 0;text-align:center}
.chero .orb{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#bfe9ff 18%,#18a9e6 45%,#3b1f9e 100%);box-shadow:0 0 0 8px rgba(255,255,255,.15),0 10px 30px rgba(0,0,0,.25)}
.chero h2{margin:0;font-size:1.7rem;letter-spacing:.08em}
ul.ck{list-style:none;padding:0;margin:6px 0}ul.ck li{padding:8px 0 8px 30px;position:relative;border-top:1px solid var(--line)}ul.ck li:first-child{border-top:0}
ul.ck li::before{content:"";position:absolute;left:4px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--grad)}

.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;margin:12px 0;cursor:pointer}
.check input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:#1f4fbf}
/* CELYN chat */
#celyn.chat{padding-bottom:calc(270px + env(safe-area-inset-bottom))}
.cwarn{font-size:.85rem;color:var(--mut);text-align:center;margin:0 0 8px}
.cmsgs{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:11px 14px;border-radius:18px;line-height:1.45;font-size:1rem;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:6px;position:relative}
.bub.dim{color:var(--mut);font-style:italic}
.bub .rd{background:none;border:0;color:var(--br);cursor:pointer;min-width:40px;min-height:36px;padding:4px 0 0;display:block}
.bub .att{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:6px;opacity:.95}.bub .att img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.cbar{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);padding:8px 0 6px;z-index:15}
.crow{display:flex;gap:8px;align-items:flex-end}.crow textarea{min-height:48px;max-height:120px;resize:none;padding:12px 14px}
.cbtn{flex:none;width:52px;height:52px;border-radius:16px;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:pointer}
.ctools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.ctool{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;min-height:52px;padding:6px 4px;font:inherit;font-size:.78rem;cursor:pointer;text-align:center;line-height:1.15}
.ctool.on{background:var(--red);color:#fff;border-color:var(--red)}
.cpend{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:6px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:6px 8px}.cpend img{width:40px;height:40px;object-fit:cover;border-radius:8px}.cpend span{flex:1}
.crec{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:700;font-size:.9rem;margin-bottom:6px}.crec i{width:12px;height:12px;border-radius:50%;background:var(--red);animation:pl2 1s ease-in-out infinite}@keyframes pl2{50%{opacity:.25}}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(8,10,25,.6);display:none;place-items:center;z-index:50;padding:18px}
.modal.on{display:grid}
.modal .mc{background:var(--surf);color:var(--ink);border-radius:22px;padding:22px 18px;max-width:400px;width:100%;text-align:center;position:relative}
.modal .mc img{width:64px;height:64px;border-radius:16px}
.stars{display:flex;justify-content:center;gap:6px;margin:12px 0}
.stars button{background:none;border:0;cursor:pointer;color:#c7cbe0;min-width:48px;min-height:48px;padding:2px}
.stars button.on{color:#f5b301}.stars .ic{width:40px;height:40px;fill:currentColor;stroke:currentColor}
.mx{position:absolute;right:8px;top:8px;background:none;border:0;color:var(--mut);min-width:44px;min-height:44px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#15172b;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90vw;font-size:.95rem;text-align:center}
#comfort{position:fixed;inset:0;pointer-events:none;z-index:100;background:#ff9329;mix-blend-mode:multiply;opacity:0}
@media(max-width:360px){.tiles{grid-template-columns:1fr}}
@media print{
 body{background:#fff;color:#111}
 .nav,#comfort,#toast,.modal,.noprint,.top .iconbtn{display:none!important}
 .scr{display:none!important;padding:0!important;min-height:0}
 body.pr-card #card,body.pr-report #report{display:block!important}
 body.pr-card #card .wrap>*:not(.ecard){display:none!important}
 .top{background:none!important;color:#111;padding:0;border-radius:0}
 .prhead{display:flex!important;align-items:center;gap:10px;margin-bottom:10px}
 .card,.stat,.ent{break-inside:avoid;border-color:#ccc}
 .bars i{background:#1f4fbf!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

 r15Steps:['1. Tome 15 g de carboidrato de ação rápida (por exemplo, suco de fruta ou açúcar dissolvido em água, conforme o seu plano).|2. Depois de 15 minutos, meça a glicose de novo.|3. Se ainda estiver baixa, siga o seu plano de tratamento.','1. Take 15 g of fast-acting carbohydrate (for example fruit juice or sugar dissolved in water, as in your plan).|2. After 15 minutes, measure your glucose again.|3. If it is still low, follow your personal treatment plan.','1. Toma 15 g de carbohidratos de acción rápida (por ejemplo zumo o azúcar disuelto en agua, según tu plan).|2. Pasados 15 minutos, mide la glucosa de nuevo.|3. Si sigue baja, sigue tu plan de tratamiento.','1. Neem 15 gram snelwerkende koolhydraten (bijvoorbeeld vruchtensap of suiker opgelost in water, volgens je plan).|2. Meet na 15 minuten opnieuw je glucose.|3. Is die nog laag, volg dan je eigen behandelplan.'],

 // celyn
 celynSub:['Sua assistente pessoal de apoio','Your personal support assistant','Tu asistente personal de apoyo','Je persoonlijke ondersteuningsassistent'],
 celynStatus:['Demonstração com Google Gemini','Demo with Google Gemini','Demostración con Google Gemini','Demo met Google Gemini'],
 celynWill:['O que a CELYN AI vai fazer','What CELYN AI will do','Qué hará CELYN AI','Wat CELYN AI gaat doen'],
 celynFeat:['Responder perguntas por texto, em linguagem simples.|Receber mensagens de voz e responder por escrito.|Conversas ao vivo por voz, com botão de iniciar e parar.|Explicar fotos de exames, receitas e documentos médicos, sem inventar valores.','Answer typed questions in plain language.|Receive voice messages and reply in writing.|Live voice conversations, with start and stop buttons.|Explain photos of lab results, prescriptions and medical documents, without inventing values.','Responder preguntas escritas en lenguaje sencillo.|Recibir mensajes de voz y responder por escrito.|Conversaciones de voz en vivo, con botón de iniciar y parar.|Explicar fotos de análisis, recetas y documentos médicos, sin inventar valores.','Getypte vragen beantwoorden in eenvoudige taal.|Spraakberichten ontvangen en schriftelijk antwoorden.|Live spraakgesprekken, met start- en stopknop.|Foto’s van uitslagen, recepten en medische documenten uitleggen, zonder waarden te verzinnen.'],
 celynNeeds:['Por que ainda não está ativa','Why it is not active yet','Por qué aún no está activa','Waarom het nog niet actief is'],
 celynNeedsTxt:['Para funcionar com segurança, a CELYN precisa de um servidor protegido e de um serviço de IA (com custo mensal). Antes de enviar dados de saúde, o GLYSA vai pedir a sua permissão explícita. Preferimos não mostrar uma função de mentira.','To work safely, CELYN needs a protected server and an AI service (with a monthly cost). Before sending any health data, GLYSA will ask for your explicit permission. We prefer not to show a fake feature.','Para funcionar con seguridad, CELYN necesita un servidor protegido y un servicio de IA (con coste mensual). Antes de enviar datos de salud, GLYSA pedirá tu permiso explícito. Preferimos no mostrar una función falsa.','Om veilig te werken heeft CELYN een beveiligde server en een AI-dienst nodig (met maandelijkse kosten). Voordat er gezondheidsgegevens worden verstuurd, vraagt GLYSA eerst je uitdrukkelijke toestemming. We tonen liever geen nepfunctie.'],
 celynSafe:['Regras de segurança da CELYN','CELYN safety rules','Normas de seguridad de CELYN','Veiligheidsregels van CELYN'],
 celynSafeTxt:['Não faz diagnóstico.|Não prescreve tratamento nem altera doses.|Diz claramente quando não tem certeza.|Em emergências, orienta a buscar ajuda profissional.','Does not diagnose.|Does not prescribe treatment or change doses.|Says clearly when it is unsure.|In emergencies, advises professional help.','No diagnostica.|No receta tratamientos ni cambia dosis.|Dice claramente cuando no está segura.|En emergencias, aconseja buscar ayuda profesional.','Stelt geen diagnose.|Schrijft geen behandeling voor en past geen doses aan.|Zegt duidelijk wanneer ze iets niet zeker weet.|Adviseert bij noodsituaties professionele hulp.'],
 faqTitle:['Perguntas frequentes sobre o GLYSA (sem IA)','Frequently asked questions about GLYSA (no AI)','Preguntas frecuentes sobre GLYSA (sin IA)','Veelgestelde vragen over GLYSA (geen AI)'],
 faq:[
  ['O GLYSA mede a minha glicose?|Não. Só um glicosímetro ou sensor mede a glicose. O teste dos olhos é experimental.','Onde ficam os meus dados?|Nesta versão, só neste aparelho. Você pode exportar ou apagar tudo nos Ajustes.','Como uso o MODO CRISE?|Toque no botão vermelho na tela inicial. Ele mostra opções grandes: ligar, mensagem, regra dos 15 e cartão de emergência.','Posso mudar o idioma?|Sim, em Ajustes > Idioma. A mudança é imediata.'],
  ['Does GLYSA measure my glucose?|No. Only a meter or sensor measures glucose. The eye test is experimental.','Where is my data stored?|In this version, only on this device. You can export or delete everything in Settings.','How do I use CRISIS MODE?|Tap the red button on the home screen. It shows large options: call, message, the 15 rule and your emergency card.','Can I change the language?|Yes, in Settings > Language. The change is immediate.'],
  ['¿GLYSA mide mi glucosa?|No. Solo un glucómetro o sensor mide la glucosa. La prueba de los ojos es experimental.','¿Dónde se guardan mis datos?|En esta versión, solo en este dispositivo. Puedes exportar o borrar todo en Ajustes.','¿Cómo uso el MODO CRISIS?|Toca el botón rojo en la pantalla de inicio. Muestra opciones grandes: llamar, mensaje, regla de los 15 y tarjeta de emergencia.','¿Puedo cambiar el idioma?|Sí, en Ajustes > Idioma. El cambio es inmediato.'],
  ['Meet GLYSA mijn glucose?|Nee. Alleen een glucosemeter of sensor meet glucose. De oogtest is experimenteel.','Waar staan mijn gegevens?|In deze versie alleen op dit apparaat. Je kunt alles exporteren of wissen bij Instellingen.','Hoe gebruik ik de CRISISMODUS?|Tik op de rode knop op het startscherm. Je krijgt grote knoppen: bellen, bericht, de 15-minutenregel en je noodkaart.','Kan ik de taal wijzigen?|Ja, bij Instellingen > Taal. De wijziging is direct zichtbaar.']],

// ---- Glysa meetkern (AOKC-1) — gedeeld door beide taalversies ----
// Sample: {t (ms), g (blikratio of null), lum (helderheid 0-255 of undefined)}
// Sprong:  {t (ms), x (doelpositie -1..1)}
function median(a){ if(!a.length) return NaN; const b=[...a].sort((p,q)=>p-q), m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; }
function fitLine(xs, ys){
  const n = xs.length; if (n < 3) return { a:NaN, k:NaN, r:0 };
  const mx = xs.reduce((p,q)=>p+q,0)/n, my = ys.reduce((p,q)=>p+q,0)/n;
  let sxy=0, sxx=0, syy=0;
  for (let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
  const k = sxx ? sxy/sxx : NaN;
  return { a: my - k*mx, k, r: (sxx && syy) ? sxy/Math.sqrt(sxx*syy) : 0 };
}
function targetAt(J, t){ let k=-1; for (let i=0;i<J.length;i++) if (J[i].t <= t) k=i; return k; }
function smooth(valid){
  return valid.map((s,i,a) => (i===0 || i===a.length-1) ? { t:s.t, g:s.g } : { t:s.t, g:median([a[i-1].g, s.g, a[i+1].g]) });
}
function lightIssue(S){
  const L = S.map(s => s.lum).filter(v => v != null);
  if (!L.length) return null;
  const m = median(L);
  return m < 45 ? 'dark' : m > 225 ? 'bright' : null;
}

// Stap 2 van AOKC: instellen. Koppelt de blikratio aan de schermpositie.
function calibrate(S, J){
  const valid = S.filter(s => s.g != null && isFinite(s.g));
  const lost = S.length ? 1 - valid.length/S.length : 1;
  const xs = [], ys = [];
  for (const s of smooth(valid)){ const j = targetAt(J, s.t); if (j >= 0 && s.t - J[j].t > 350){ xs.push(J[j].x); ys.push(s.g); } }
  const f = fitLine(xs, ys);
  const issues = [];
  if (lost > 0.25) issues.push('face');
  else if (xs.length < 15 || Math.abs(f.r) < 0.7 || !isFinite(f.k) || Math.abs(f.k) < 1e-4) issues.push('track');
  const li = lightIssue(S); if (li) issues.push(li);
  return { ok: issues.length === 0, issues, a:f.a, k:f.k, r:Math.abs(f.r), lost };
}

// Stap 3-4 van AOKC: één testdeel meten en de kwaliteit controleren.
function measurePart(S, J, cal){
  const valid = S.filter(s => s.g != null && isFinite(s.g));
  const lost = S.length ? 1 - valid.length/S.length : 1;
  const dur = S.length > 1 ? (S[S.length-1].t - S[0].t)/1000 : 0;
  const fps = dur > 0 ? (S.length-1)/dur : 0;
  const z = smooth(valid).map(s => ({ t:s.t, z:(s.g - cal.a)/cal.k }));

  // Nauwkeurigheid en stabiliteit tijdens fixaties
  const xs = [], ys = [], sds = [];
  for (let i=0;i<J.length;i++){
    const t0 = J[i].t + 350, t1 = (i+1<J.length ? J[i+1].t : J[i].t + 1200);
    const seg = z.filter(p => p.t > t0 && p.t <= t1);
    seg.forEach(p => { xs.push(J[i].x); ys.push(p.z); });
    if (seg.length >= 4){ const m = seg.reduce((p,q)=>p+q.z,0)/seg.length; sds.push(Math.sqrt(seg.reduce((p,q)=>p+(q.z-m)**2,0)/seg.length)); }
  }
  const f = fitLine(xs, ys);

  // Reactietijd en piek-snelheid per sprong
  const lats = [], vels = [];
  for (let i=1;i<J.length;i++){
    const tj = J[i].t, dxT = J[i].x - J[i-1].x;
    if (Math.abs(dxT) < 0.3) continue;
    const d = Math.sign(dxT), end = (i+1 < J.length ? J[i+1].t : tj + 900);
    const before = z.filter(p => p.t >= tj-200 && p.t <= tj); if (!before.length) continue;
    const base = median(before.map(p => p.z));
    const win = z.filter(p => p.t > tj-40 && p.t <= Math.min(end, tj+900));
    const half = 0.5*Math.abs(dxT); let tc = null, vmax = 0;
    for (let m=1;m<win.length;m++){
      const p0=(win[m-1].z-base)*d, p1=(win[m].z-base)*d;
      if (tc == null && p0 < half && p1 >= half) tc = win[m-1].t + (half-p0)/(p1-p0)*(win[m].t-win[m-1].t);
      const dt = (win[m].t-win[m-1].t)/1000; if (dt > 0){ const v=(win[m].z-win[m-1].z)*d/dt; if (v > vmax) vmax = v; }
    }
    if (tc != null){ const L = tc - tj; if (L >= 60 && L <= 900) lats.push(L); }
    if (vmax > 0) vels.push(vmax*50);
  }

  const issues = [];
  if (lost > 0.2) issues.push('face');
  if (fps > 0 && fps < 20) issues.push('fps');
  if (!issues.includes('face') && (lats.length < 3 || Math.abs(f.r) < 0.5)) issues.push('track');
  const li = lightIssue(S); if (li) issues.push(li);

  return {
    ok: issues.length === 0, issues,
    metrics: {
      latency_ms: lats.length ? Math.round(median(lats)) : null,               // tijd tot halverwege de sprong
      peak_velocity_pct_s: vels.length ? Math.round(median(vels)) : null,       // % schermbreedte per seconde
      gain: isFinite(f.k) ? +f.k.toFixed(2) : null,                             // bewegingsafstand t.o.v. doel (1 = precies)
      accuracy_r: +Math.abs(f.r).toFixed(2),                                    // correlatie blik-doel (0-1)
      stability_pct: sds.length ? +(median(sds)*50).toFixed(1) : null,          // spreiding tijdens fixatie, % schermbreedte
      lost_pct: Math.round(lost*100), fps: Math.round(fps), saccades: lats.length
    },
    z
  };
}

// Stap 5: kwaliteitsstatus van de hele sessie (alleen over de opname, nooit over gezondheid)
function sessionStatus(parts){
  const usable = parts.filter(p => p.status !== 'invalid').length;
  return usable === parts.length && parts.length ? 'suitable' : usable > 0 ? 'partial' : 'unusable';
}

// ---------------- Navigatie ----------------
const NAV_SCREENS = ['home','diary','celyn','settings','report','support','card','profile','entry'];
let cur = null;
function show(id, push = true, opts){
  if (cur === 'test' && id !== 'test' && id !== 'run') stopCamera();
  if (cur === 'celyn' && id !== 'celyn' && typeof stopLive === 'function') stopLive();
  cur = id;
  document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id));
  const R = RENDER[id]; if (R) R(opts || {});
  renderNav();
  if (push) try { history.pushState({ s:id }, ''); } catch(e){}
  if (id !== 'run') window.scrollTo(0,0);
}
addEventListener('popstate', e => {
  const s = e.state && e.state.s;
  if (cur === 'run'){ abortRun(); return; }
  if (s && st.onboarded) show(s, false); else if (st.onboarded) show('home', false);
});
function renderNav(){
  const n = $('nav'); const on = NAV_SCREENS.includes(cur) && st.onboarded;
  n.classList.toggle('on', on); if (!on) return;
  const b = (id, icn, lab, mid) => `<button data-go="${id}" class="${cur===id?'on':''} ${mid?'mid':''}">${mid?`<i>${ic(icn)}</i>`:ic(icn)}<span>${lab}</span></button>`;
  n.innerHTML = b('home','home',t('navHome')) + b('diary','book',t('navDiary')) + b('celyn','chat',t('navCelyn'),1) + b('settings','gear',t('navSettings'));
}
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); show(g.dataset.go); } });
const header = (title, sub, backTo) => `<div class="top"><div class="wrap">${backTo?`<button class="iconbtn" data-go="${backTo}" aria-label="${t('back')}">${ic('back')}</button>`:`<img class="logo" src="${HERO}" alt="">`}<div class="sp"><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div></div></div>`;

   <h3>${t('expObs')}</h3>${T.length ? `<div class="scroll"><table class="rt"><thead><tr><th>${t('date')}</th><th>${t('resTitle')}</th><th>${t('mLat')}</th><th>${t('mBlink')}</th></tr></thead><tbody>
    ${T.slice().reverse().map(x => `<tr><td>${fmtDate(x.ts, { day:'2-digit', month:'2-digit' })} ${fmtTime(x.ts)}${x.demo?' (demo)':''}</td><td>${x.quality==='good'?t('qGood'):t('qPoor')}</td><td>${x.metrics && x.metrics.latency ? x.metrics.latency + ' ms' : '–'}</td><td>${x.metrics && x.metrics.blinks != null ? x.metrics.blinks : '–'}</td></tr>`).join('')}</tbody></table></div>` : `<p class="mut">${t('repNoData')}</p>`}

    if (!gl.length){ svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".55" font-size="13">${t('repNoData')}</text>`; return; }
    const t0 = Math.min(...gl.map(g => g.ts)), t1 = Math.max(...gl.map(g => g.ts)), lo = Math.min(...gl.map(g => g.v)), hi = Math.max(...gl.map(g => g.v));
    const pad = (hi - lo) * .15 || (unit()==='mmol/L' ? 1 : 15), y0 = lo - pad, y1 = hi + pad;
    const X = ts => 36 + (t1 === t0 ? .5 : (ts - t0)/(t1 - t0)) * (W - 48), Y = v => 10 + (1 - (v - y0)/(y1 - y0)) * (H - 30);

  };
  draw(); try { new ResizeObserver(draw).observe(svg); } catch(e){}
};

// ---------------- CELYN (Google Gemini, demo) ----------------
const GEM = 'https://generativelanguage.googleapis.com/v1beta/';
const LANG_FULL = { pt:'Brazilian Portuguese', en:'English', es:'Spanish', nl:'Dutch' };
let chat = [], pending = null, busy = false, live = false, cRecog = null;
const cKey = () => { try { return localStorage.getItem('glysa_gemini_key') || ''; } catch(e){ return ''; } };
const setKey = k => { try { k ? localStorage.setItem('glysa_gemini_key', k) : localStorage.removeItem('glysa_gemini_key'); } catch(e){} };
function sysPrompt(){
  return `You are CELYN AI, the support assistant inside GLYSA, an experimental app for people with, or at risk of, hypoglycaemia. GLYSA was developed by Wéllida Soares (CTO, CIENCOD). Always answer in ${LANG_FULL[L()]}, in short, simple sentences that older people and people who read with difficulty can follow. Explain medical terms plainly.
You MAY: explain medical information and terms; explain lab values that are clearly legible in an image or document, with general reference ranges as general information; help people use GLYSA; help prepare questions for a medical appointment.
GLYSA features: an experimental eye test (about 15 seconds; it does NOT detect hypoglycaemia and gives no diagnosis), "${t('crisis')}" (big red button: call emergency services ${emNum()}, call emergency contacts, SMS with GPS location, the 15 rule with a 15-minute timer, voice commands, emergency card), a diary with reminders, a PDF report for the doctor, an emergency card, settings with eye comfort and large text, support and privacy.
You MUST NOT: diagnose; estimate or guess anyone's glucose level; prescribe or change treatment, prescriptions or medication doses; invent values that are missing or unreadable (if an image is unclear or unreadable, say so clearly); claim the eye test can detect hypoglycaemia.
Say clearly when you are not sure. Encourage checking important medical information with a qualified health professional.
If someone describes an emergency or signs of severe hypoglycaemia (confusion, fainting, seizure, unable to swallow), tell them first to call emergency services (${emNum()}) now and to open "${t('crisis')}" in GLYSA. Never suggest giving food or drink to someone who is unconscious or cannot swallow safely. For a conscious person who can swallow safely, you may mention the general 15 rule and their own treatment plan.
Keep answers under about 150 words unless the user asks for more. Use plain text with simple dashes for lists.`;
}
async function gemModels(key){
  const r = await fetch(GEM + 'models?pageSize=200&key=' + encodeURIComponent(key));
  if (!r.ok) throw { status:r.status };
  const j = await r.json();
  const ms = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name);
  const bad = /(image|tts|audio|live|embed|vision|thinking|exp|learnlm|robotics|computer|native|nano|veo|lyria)/i;
  const score = n => { const v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1]) || 0; return v*10 - (/lite/i.test(n) ? 3 : 0) - (/preview/i.test(n) ? 1 : 0); };
  const flash = ms.filter(n => /gemini-[\d.]+-flash/i.test(n) && !bad.test(n)).sort((a,b) => score(b) - score(a));
  const alias = ms.filter(n => /gemini-flash(-lite)?-latest/i.test(n));
  const list = [...flash, ...alias];
  if (!list.length) throw { status:404 };
  return list.slice(0, 6);
}
async function gemAsk(){
  const key = cKey(); if (!key) throw { status:401 };
  let models = st.celynModels; if (!models || !models.length){ models = await gemModels(key); st.celynModels = models; save(); }
  const contents = chat.filter(m => m.role !== 'hello').slice(-14).map(m => ({ role: m.role === 'user' ? 'user' : 'model',
    parts: [...(m.file ? [{ inline_data:{ mime_type:m.file.mime, data:m.file.data } }] : []), { text: m.text || t('cPhotoQ') }] }));
  const body = JSON.stringify({ system_instruction:{ parts:[{ text:sysPrompt() }] }, contents, generationConfig:{ temperature:0.4, maxOutputTokens:900 } });
  let lastErr = null;
  for (const m of models){
    let r;
    try { r = await fetch(GEM + m + ':generateContent?key=' + encodeURIComponent(key), { method:'POST', headers:{ 'Content-Type':'application/json' }, body }); }
    catch(e){ throw { status:0 }; }
    if (r.ok){
      const j = await r.json();
      const txt = (((j.candidates || [])[0] || {}).content || {}).parts?.map(p => p.text || '').join('').trim();
      if (txt){ if (st.celynModels[0] !== m){ st.celynModels = [m, ...models.filter(x => x !== m)]; save(); } return { text:txt, model:m }; }
      lastErr = { status:500 }; continue;
    }
    lastErr = { status:r.status };
    if (r.status === 400 || r.status === 401) break;
  }
  throw lastErr || { status:500 };
}
const errText = e => e.status === 0 ? t('cOffline') : (e.status === 400 || e.status === 401 || e.status === 403) ? t('cBadKey') : e.status === 429 ? t('cLimit') : t('cErr');
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^\s*[-*•]\s+/gm, '• ').replace(/\n/g, '<br>');

    ? `<div class="bub me">${m.file ? `<div class="att">${m.file.thumb ? `<img src="${m.file.thumb}" alt="">` : ic('card')} ${esc(m.file.name || '')}</div>` : ''}${m.text ? esc(m.text) : ''}</div>`

async function sendChat(text){
  text = (text || '').trim();
  if (busy || (!text && !pending)) return;
  chat.push({ role:'user', text, file:pending }); pending = null; renderPending();
  busy = true; renderMsgs();
  try { const r = await gemAsk(); chat.push({ role:'model', text:r.text }); busy = false; renderMsgs(); if (live) speakThenListen(r.text); }
  catch(e){ busy = false; chat.push({ role:'model', text:errText(e) }); renderMsgs(); if (live) stopLive(); }
}
function renderPending(){ const p = $('cpend'); if (!p) return; p.hidden = !pending; if (pending) p.innerHTML = `${pending.thumb ? `<img src="${pending.thumb}" alt="">` : ic('card')}<span>${t('cAttached')}: ${esc(pending.name)}</span><button class="del" id="cpx">${ic('x')}</button>`; if ($('cpx')) $('cpx').onclick = () => { pending = null; renderPending(); }; }
function listenOnce(onText){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast(t('voiceNo')); return false; }
  try { cRecog && cRecog.abort(); } catch(e){}
  cRecog = new SR(); cRecog.lang = SPEECH_LANG[L()]; cRecog.interimResults = false;
  const ind = $('crec'); if (ind){ ind.hidden = false; }
  cRecog.onresult = e => { const txt = Array.from(e.results).map(r => r[0].transcript).join(' '); onText(txt); };
  cRecog.onend = () => { if (ind) ind.hidden = true; };
  cRecog.onerror = () => { if (ind) ind.hidden = true; if (live) stopLive(); };
  try { cRecog.start(); } catch(e){ toast(t('voiceNo')); return false; }
  return true;
}
function speakThenListen(text){
  try {
    const ss = window.speechSynthesis; ss.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*•]/g, '')); u.lang = SPEECH_LANG[L()]; u.rate = 0.97;
    u.onend = () => { if (live) listenOnce(txt => sendChat(txt)); };
    ss.speak(u);
  } catch(e){ if (live) listenOnce(txt => sendChat(txt)); }
}
function stopLive(){ live = false; try { cRecog && cRecog.abort(); } catch(e){} try { speechSynthesis.cancel(); } catch(e){} const b = $('clive'); if (b){ b.classList.remove('on'); b.innerHTML = ic('speaker') + `<span>${t('cLive')}</span>`; } const ind = $('crec'); if (ind) ind.hidden = true; }

      <label class="check"><input type="checkbox" id="cCons" ${st.celynConsent?'checked':''}><span style="font-weight:500">${t('cConsent')}</span></label>
      <p class="err" id="cKeyErr" hidden></p>
      <button class="btn" id="cAct" ${st.celynConsent?'':'disabled'}>${ic('chat')}${t('cActivate')}</button>
      <p class="small">${t('cFinal')}</p></div>
     <details class="box"><summary>${t('celynSafe')}</summary><div class="in"><ul class="ck">${tl('celynSafeTxt').map(x => `<li>${x}</li>`).join('')}</ul></div></details>
     <h3>${t('faqTitle')}</h3>${S.faq[LI()].map(q => { const [a,b] = q.split('|'); return `<details class="box"><summary>${a}</summary><div class="in">${b}</div></details>`; }).join('')}</div>`;
    $('cCons').onchange = e => { $('cAct').disabled = !e.target.checked; };
    $('cAct').onclick = async () => {
      const k = $('cKeyIn').value.trim(), er = $('cKeyErr'); if (!k){ $('cKeyIn').focus(); return; }
      $('cAct').disabled = true; $('cAct').textContent = t('cChecking'); er.hidden = true;
      try { const ms = await gemModels(k); setKey(k); st.celynModels = ms; st.celynConsent = true; save(); RENDER.celyn(); }
      catch(e){ er.textContent = errText(e); er.hidden = false; $('cAct').disabled = false; $('cAct').innerHTML = ic('chat') + t('cActivate'); }
    };
    return;
  }
  $('celyn').classList.add('chat');
  $('celyn').innerHTML = header('CELYN AI', t('cDemoBadge'), null) + `<div class="wrap">
   <p class="cwarn">${t('cWarnBar')}</p>
   <div id="cmsgs" class="cmsgs" aria-live="polite"></div>
   <p class="small" style="text-align:center">${t('cModel')}: ${esc((st.celynModels && st.celynModels[0] || '').replace('models/',''))} · <button class="del" id="cNew">${t('cNew')}</button> · <button class="del" id="cRm">${t('cRemoveKey')}</button></p>
  </div>
  <div class="cbar"><div class="wrap">
   <div class="cpend" id="cpend" hidden></div>
   <div class="crec" id="crec" hidden><i></i>${t('cRecording')}</div>
   <div class="crow"><textarea class="in" id="cIn" rows="1" placeholder="${t('cPlaceholder')}"></textarea><button class="cbtn send" id="cSend" aria-label="${t('cSend')}">${ic('msg')}</button></div>
   <div class="ctools"><button class="ctool" id="cMic">${ic('mic')}<span>${t('cVoiceMsg')}</span></button><button class="ctool" id="clive">${ic('speaker')}<span>${t('cLive')}</span></button><label class="ctool">${ic('plus')}<span>${t('cPhoto')}</span><input type="file" id="cFile" accept="image/*,application/pdf" hidden></label></div>
  </div></div>`;
  renderMsgs(); renderPending();
  const inp = $('cIn');
  $('cSend').onclick = () => { const v = inp.value; inp.value = ''; sendChat(v); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('cSend').click(); } });
  $('cMic').onclick = () => { stopLive(); listenOnce(txt => sendChat(txt)); };
  $('clive').onclick = () => {
    if (live){ stopLive(); return; }
    live = true; $('clive').classList.add('on'); $('clive').innerHTML = ic('x') + `<span>${t('cLiveStop')}</span>`;
    if (!listenOnce(txt => sendChat(txt))) stopLive();
  };
  $('cFile').onchange = () => {
    const f = $('cFile').files[0]; if (!f) return; if (f.size > 8e6){ toast(t('cTooBig')); return; }
    const r = new FileReader();
    r.onload = () => {
      if (f.type === 'application/pdf'){ pending = { mime:'application/pdf', data:String(r.result).split(',')[1], name:f.name }; renderPending(); return; }
      const img = new Image(); img.onload = () => {
        const sc = Math.min(1, 1280/Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const url = c.toDataURL('image/jpeg', .85);
        const tc = document.createElement('canvas'), ts = 120/Math.max(c.width, c.height); tc.width = Math.round(c.width*ts); tc.height = Math.round(c.height*ts); tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
        pending = { mime:'image/jpeg', data:url.split(',')[1], name:f.name, thumb:tc.toDataURL('image/jpeg', .7) }; renderPending();
      }; img.src = r.result;
    };
    r.readAsDataURL(f); $('cFile').value = '';
  };
  $('cNew').onclick = () => { stopLive(); chat = []; pending = null; renderMsgs(); renderPending(); };
  $('cRm').onclick = e => twoTap(e.currentTarget, 'ckey', () => { stopLive(); setKey(''); st.celynConsent = false; st.celynModels = null; chat = []; save(); RENDER.celyn(); });
};

// ---------------- Instellingen ----------------
RENDER.settings = () => {
  const s = st.settings;
  $('settings').innerHTML = header(t('setTitle'), '', null) + `<div class="wrap">
   <h3>${t('setLang')}</h3><div class="seg lg">${LANGS.map(l => `<button data-sl="${l}" class="${L()===l?'on':''}">${LANG_NAMES[l]}</button>`).join('')}</div>
   <button class="btn sec" data-go="profile">${ic('user')}${t('setProfile')}</button>
   <h3>${t('setText')}</h3><div class="seg">${['tNormal','tLarge','tXL'].map((k,i) => `<button data-ts="${i}" class="${(s.text||0)===i?'on':''}">${t(k)}</button>`).join('')}</div>
   <div class="chips" style="margin-top:12px"><label class="chip ${s.speak?'on':''}"><input type="checkbox" id="sSpeak" ${s.speak?'checked':''}>${t('setSpeak')}</label></div>
   <h3>${t('setComfort')}</h3><label class="f" for="sComfort">${t('intensity')}: <span id="cv">${s.comfort||0}%</span></label><input type="range" id="sComfort" min="0" max="100" step="5" value="${s.comfort||0}" style="width:100%;min-height:44px;accent-color:#1f4fbf">
   <div class="row2"><div><label class="f" for="sUnit">${t('setUnit')}</label><select class="in" id="sUnit">${['mg/dL','mmol/L'].map(u => `<option ${unit()===u?'selected':''}>${u}</option>`).join('')}</select></div>
    <div><label class="f" for="sEm">${t('setEmergency')}</label><input class="in" id="sEm" inputmode="tel" value="${esc(emNum())}"></div></div>
   <h3>${t('setPerms')}</h3><div class="card" id="perms"></div><p class="small">${t('permNote')}</p>
   <h3>${t('setDevices')}</h3><div class="card"><p style="margin:0">${t('devicesTxt')}</p></div>
   <h3>${t('setAccount')}</h3><div class="card"><p style="margin:0">${t('accountTxt')}</p></div>
   <button class="btn sec" id="sExport">${ic('dl')}${t('exportData')}</button>
   <button class="btn sec" id="sDelete" style="color:var(--red)">${t('deleteData')}</button>
   <details class="box"><summary>${t('install')}</summary><div class="in">${t('installTxt')}</div></details>
   <details class="box"><summary>${t('setDemo')}</summary><div class="in"><div class="chips"><label class="chip ${s.fastTimer?'on':''}"><input type="checkbox" id="sFast" ${s.fastTimer?'checked':''}>${t('fastTimer')}</label></div><button class="btn sec" id="sRate">${ic('star')}${t('showRating')}</button></div></details>
   <button class="btn sec" data-go="support">${ic('info')}${t('tileSupport')}</button>
   <p class="small" style="text-align:center">GLYSA ${t('version')} ${APP_VERSION} · ${METHOD}</p></div>`;
  const R = $('settings');
  R.querySelectorAll('[data-sl]').forEach(b => b.onclick = () => { st.lang = b.dataset.sl; save(); applySettings(); RENDER.settings(); renderNav(); });
  R.querySelectorAll('[data-ts]').forEach(b => b.onclick = () => { s.text = +b.dataset.ts; save(); applySettings(); RENDER.settings(); });
  $('sSpeak').onchange = e => { s.speak = e.target.checked; e.target.parentElement.classList.toggle('on', s.speak); save(); };
  $('sComfort').oninput = e => { s.comfort = +e.target.value; $('cv').textContent = s.comfort + '%'; applySettings(); save(); };
  $('sUnit').onchange = e => { s.unit = e.target.value; save(); };
  $('sEm').oninput = e => { s.emergency = e.target.value.trim() || null; save(); };
  $('sFast').onchange = e => { s.fastTimer = e.target.checked; e.target.parentElement.classList.toggle('on', s.fastTimer); save(); };
  $('sRate').onclick = () => showRating(true);
  $('sExport').onclick = () => download('glysa-mijn-gegevens-' + isoDay(Date.now()) + '.json', JSON.stringify({ app:'GLYSA', version:APP_VERSION, exported:new Date().toISOString(), data:st }, null, 1), 'application/json');
  $('sDelete').onclick = e => twoTap(e.currentTarget, 'del', () => { try { localStorage.removeItem(KEY); } catch(x){} location.reload(); });
  perms();
};
async function perms(){
  const el = $('perms'); if (!el) return;
  const rows = [];
  for (const p of ['camera','microphone','geolocation']){
    let v = 'pUnknown'; try { const r = await navigator.permissions.query({ name:p }); v = r.state === 'granted' ? 'pGranted' : r.state === 'denied' ? 'pDenied' : 'pPrompt'; } catch(e){}
    rows.push(`<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${t('perm_'+p)}</span><b>${t(v)}</b></div>`);
  }
  if ($('perms')) $('perms').innerHTML = rows.join('');
}
RENDER.profile = () => {
  $('profile').innerHTML = header(t('setProfile'), P.mode==='dx'?t('modeLblDx'):P.mode==='no'?t('modeLblNo'):'', 'settings') + `<div class="wrap">${SECTIONS.basic()}
   <h3>${t('modeQ')}</h3><div class="seg"><button data-pm="dx" class="${P.mode==='dx'?'on':''}">${t('modeDx')}</button><button data-pm="no" class="${P.mode==='no'?'on':''}">${t('modeNo')}</button></div>
   ${P.mode ? modeSections().map(k => SECTIONS[k]()).join('') : ''}
   <button class="btn" data-go="home">${t('done')}</button></div>`;
  bindForm($('profile'));
  $('profile').querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { P.mode = b.dataset.pm; save(); RENDER.profile(); });
};
RENDER.support = () => {
  $('support').innerHTML = header(t('supTitle'), '', 'home') + `<div class="wrap">
   <div class="card" style="text-align:center"><img src="${HERO}" alt="" style="width:72px;height:72px;border-radius:18px"><p class="small" style="margin:10px 0 2px">${t('devBy')}</p><p style="font-size:1.2rem;font-weight:800;margin:0">WÉLLIDA SOARES</p><p class="mut">CTO — CIENCOD</p></div>
   <h3>${t('supContact')}</h3><p>${t('supTxt')}</p>
   <a class="btn sec" href="tel:+5591990500729">${ic('phone')}+55 91 9905-0729</a>
   <a class="btn sec" href="mailto:ciencodsupport@gmail.com">${ic('msg')}ciencodsupport@gmail.com</a>
   <h3>${t('privTitle')}</h3>${S.priv[LI()].map(q => { const [a,b] = q.split('|'); return `<div class="card"><b>${a}</b><p style="margin:6px 0 0">${b}</p></div>`; }).join('')}
   <div class="note">${t('experimental')}</div><p class="small" style="text-align:center">GLYSA ${APP_VERSION}</p></div>`;
};

// ---------------- Beoordeling ----------------
let rateShown = false, rateVal = 0;
function showRating(force){
  if (!force && (st.rating.done || st.rating.never || rateShown)) return;
  rateShown = true; rateVal = 0;
  const mc = $('mc');
  const draw = () => {
    mc.innerHTML = `<button class="mx" id="rx" aria-label="${t('close')}">${ic('x')}</button><img src="${HERO}" alt=""><h3>${t('rateQ')}</h3><p class="mut">${t('rateCall')}</p>
    <div class="stars">${[1,2,3,4,5].map(i => `<button data-star="${i}" class="${i<=rateVal?'on':''}" aria-label="${i}">${ic('star')}</button>`).join('')}</div>
    ${rateVal ? `<button class="btn" id="rSend">${t('rateSend')}</button>` : ''}<button class="btn ghost" id="rNever">${t('rateNever')}</button>`;
    mc.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { rateVal = +b.dataset.star; draw(); });
    $('rx').onclick = () => $('modal').classList.remove('on');
    $('rNever').onclick = () => { st.rating.never = true; save(); $('modal').classList.remove('on'); };
    if ($('rSend')) $('rSend').onclick = () => { st.rating = { done:true, never:false, value:rateVal, ts:Date.now() }; save();
      mc.innerHTML = `<img src="${HERO}" alt=""><h3>${'★'.repeat(rateVal)}</h3><p>${t('rateThanks')}</p><button class="btn" id="rOk">${t('close')}</button>`; $('rOk').onclick = () => $('modal').classList.remove('on'); };
  };
  draw(); $('modal').classList.add('on');
}
setInterval(() => {
  if (document.visibilityState !== 'visible' || !st.onboarded) return;
  st.usage = (st.usage || 0) + 15; save();
  if (st.usage >= 300 && !['run','crisis','test'].includes(cur)) showRating(false);
}, 15000);

// ---------------- Start ----------------
applySettings();
if (st.timerEnd){ if (st.timerEnd > Date.now()) tickTimer(); else { st.timerEnd = null; save(); } }
show('splash', false);
try { history.replaceState({ s:'splash' }, ''); } catch(e){}
setTimeout(() => { if (!st.lang) show('lang'); else if (!st.onboarded) show('ob', true, { step:0 }); else show('home'); }, 1500);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.__g = { st, show, t, RENDER };
}
</script>
